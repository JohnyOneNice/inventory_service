# PostgreSQL подключение
spring.datasource.driver-class-name=org.postgresql.Driver
spring.application.name=inventoryservice
spring.datasource.url=jdbc:postgresql://postgres:5432/myinventory
spring.datasource.username=myuser
spring.datasource.password=mypassword


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka config
spring.kafka.bootstrap-servers=redpanda:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.group-id=inventory-service-v3
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.inventory_service.dto.OrderCreatedEvent
inventory.events.topic=inventory-reserved

